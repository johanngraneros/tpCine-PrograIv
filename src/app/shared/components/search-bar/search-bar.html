<div class="search-container">
  <input 
    type="text" 
    [value]="termino()" 
    (input)="termino.set($any($event.target).value)"
    placeholder="🔍 Buscar película..."
    class="search-input"
  >
  @if (termino()) {
    <button type="button" (click)="limpiar()" class="clear-btn" aria-label="Limpiar búsqueda">✕</button>
  }
</div>
